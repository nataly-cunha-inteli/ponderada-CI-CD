name: Pipeline CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    name: Análise Estática (Lint)
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código-fonte
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar flake8
        run: pip install flake8

      - name: Executar análise estática
        run: flake8 src/ tests/ --max-line-length=100

  test:
    name: Executar Testes Automatizados
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Baixar código-fonte
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências de desenvolvimento
        run: pip install -r requirements-dev.txt

      - name: Executar testes com pytest
        run: pytest tests/ --junit-xml=test-results.xml -v

      - name: Processar resultados dos testes
        if: always()
        run: python scripts/processar_resultados.py

      - name: Publicar artefatos dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-testes
          path: |
            test-results.xml
            test-meta.json
